name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Syntax check and Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # There is no test suite and no dependency: parse every script, build the image,
      # then check that the container starts and answers its health endpoint.
      - name: Syntax check
        run: |
          for f in server/*.js public/js/*.js public/support/*.js; do
            node --check "$f"
          done
      - name: Build image
        run: docker build -t mccs:ci .
      - name: Smoke test
        run: |
          docker run -d --name mccs -p 8080:8080 mccs:ci
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 2
          done
          docker logs mccs
          exit 1
