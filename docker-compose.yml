# mccs: mail, calendar and contacts setup assistant.
#
#   docker compose up -d
#   docker compose logs mccs     # first sign-in password for /support
#
# Then open http://<your-server>:8080/support: the assistant sets up everything
# (mail servers, calendar, contacts, logo, colours, support contact).
services:
  mccs:
    image: ghcr.io/selfhostr/mccs:latest
    container_name: mccs
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - mccs-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  mccs-data:
